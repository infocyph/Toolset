name: Apply dockex Phase 2

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-dockex-phase2.py
      - .github/workflows/apply-dockex-phase2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Apply dockex hardening
        run: python3 tests/patch-dockex-phase2.py

      - name: Validate dockex
        run: |
          bash -n Docker/dockex
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq
          shellcheck --severity=error Docker/dockex
          docker info >/dev/null

      - name: Commit dockex hardening
        run: |
          set -Eeuo pipefail
          git config user.name 'A. B. M. Mahmudul Hasan'
          git config user.email 'abmmhasan@users.noreply.github.com'
          git add Docker/dockex
          git diff --cached --quiet && exit 0
          git commit -m 'fix(dockex): harden Docker destructive data paths'
          git push origin HEAD:plan/toolset-linux-cli-hardening
