name: Add gitx Ollama support once

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - .github/workflows/add-gitx-ollama-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Apply gitx local-first AI provider integration
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/add-gitx-ollama.py
          python3 .github/scripts/fix-gitx-ollama-test.py
          bash -n Git/gitx tests/gitx.sh

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq

      - name: Validate gitx
        run: |
          set -Eeuo pipefail
          shellcheck -S error Git/gitx tests/gitx.sh
          bash tests/gitx.sh
          bash tests/docs.sh
          bash tests/security-audit.sh

      - name: Commit source, docs, and permanent tests
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Git/gitx Git/README.md tests/gitx.sh
          git diff --cached --quiet && exit 0
          git commit -m 'feat: prefer local Ollama for gitx AI commits'
          git push origin HEAD:plan/toolset-linux-cli-hardening
