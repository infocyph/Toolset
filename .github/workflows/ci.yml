name: CI

on:
  push:
    branches:
      - main
      - 'plan/**'
      - 'feature/**'
      - 'fix/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: toolset-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Static checks
        run: bash tests/static.sh

      - name: Smoke checks
        run: bash tests/smoke.sh
