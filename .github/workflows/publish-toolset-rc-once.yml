name: Publish Toolset 2.0 RC1 once

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - .github/workflows/publish-toolset-rc-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-toolset-2.0-rc1-once
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: v2.0.0-rc.1
      EXPECTED_CANDIDATE: 33601122135a3963252b92127e8d800138104007
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout publishing branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Resolve and lock accepted candidate
        id: candidate
        run: |
          set -Eeuo pipefail
          candidate="$(git rev-parse HEAD^)"
          [[ "$candidate" == "$EXPECTED_CANDIDATE" ]] || {
            echo "Publisher parent $candidate does not match accepted candidate $EXPECTED_CANDIDATE" >&2
            exit 1
          }
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "Tag $RELEASE_TAG already exists." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists." >&2
            exit 1
          fi
          echo "sha=$candidate" >> "$GITHUB_OUTPUT"

      - name: Install RC validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            shellcheck jq sqlite3 iproute2 netcat-openbsd openssl curl file

      - name: Validate exact candidate source
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -Eeuo pipefail
          git checkout --detach "$CANDIDATE_SHA"
          bash tests/static.sh
          bash tests/contracts.sh
          sudo -E bash tests/phpx.sh
          bash tests/dockex.sh
          bash tests/sqlitex.sh
          bash tests/netx.sh
          bash tests/gitx.sh
          bash tests/chromacat.sh
          bash tests/docs.sh
          bash tests/security-audit.sh

      - name: Build exact RC assets
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -Eeuo pipefail
          SOURCE_COMMIT="$CANDIDATE_SHA"
          SUITE_VERSION="${RELEASE_TAG#v}"
          export RELEASE_TAG SOURCE_COMMIT SUITE_VERSION
          bash tests/distribution.sh

      - name: Verify RC manifest identity
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -Eeuo pipefail
          RELEASE_TAG="$RELEASE_TAG" SOURCE_COMMIT="$CANDIDATE_SHA" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path('dist/manifest.json').read_text())
          suite = manifest['suite']
          assert suite['version'] == os.environ['RELEASE_TAG'].removeprefix('v')
          assert suite['release_tag'] == os.environ['RELEASE_TAG']
          assert suite['source_commit'] == os.environ['SOURCE_COMMIT']
          assert [item['name'] for item in manifest['tools']] == [
              'chromacat', 'cleanx', 'dockex', 'gitx', 'netx', 'phpx', 'sqlitex'
          ]
          PY

      - name: Create immutable RC tag
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$CANDIDATE_SHA" -m "Toolset ${RELEASE_TAG#v}"
          git push origin "$RELEASE_TAG"

      - name: Publish RC prerelease
        run: |
          set -Eeuo pipefail
          gh release create "$RELEASE_TAG" \
            dist/chromacat \
            dist/cleanx \
            dist/dockex \
            dist/gitx \
            dist/netx \
            dist/phpx \
            dist/sqlitex \
            dist/install.sh \
            dist/SHA256SUMS \
            dist/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "Toolset ${RELEASE_TAG#v}" \
            --generate-notes

      - name: Verify published RC assets and installer
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -Eeuo pipefail
          verify_dir="$(mktemp -d)"
          prefix="$(mktemp -d)"
          trap 'rm -rf -- "$verify_dir" "$prefix"' EXIT INT TERM

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$verify_dir"
          (
            cd "$verify_dir"
            sha256sum -c SHA256SUMS
          )

          RELEASE_TAG="$RELEASE_TAG" SOURCE_COMMIT="$CANDIDATE_SHA" \
            VERIFY_DIR="$verify_dir" python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['VERIFY_DIR'])
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['suite']['release_tag'] == os.environ['RELEASE_TAG']
          assert manifest['suite']['source_commit'] == os.environ['SOURCE_COMMIT']
          for item in manifest['tools']:
              payload = root / item['asset']
              assert hashlib.sha256(payload.read_bytes()).hexdigest() == item['sha256']
          installer = root / manifest['installer']['asset']
          assert hashlib.sha256(installer.read_bytes()).hexdigest() == manifest['installer']['sha256']
          PY

          bash "$verify_dir/install.sh" \
            --release "$RELEASE_TAG" \
            --prefix "$prefix" \
            --all

          for tool in chromacat cleanx dockex gitx netx phpx sqlitex; do
            NO_COLOR=1 PHPX_NO_LOG=1 NETX_COLOR=never TERM=dumb \
              "$prefix/$tool" --version >/dev/null
          done

      - name: Verify exact-release self-update paths
        run: |
          set -Eeuo pipefail
          prefix="$(mktemp -d)"
          trap 'rm -rf -- "$prefix"' EXIT INT TERM
          bash dist/install.sh --release "$RELEASE_TAG" --prefix "$prefix" gitx phpx cleanx chromacat

          TOOLSET_SELF_UPDATE_RELEASE="$RELEASE_TAG" \
            "$prefix/gitx" self-update
          TOOLSET_SELF_UPDATE_RELEASE="$RELEASE_TAG" PHPX_NO_LOG=1 \
            "$prefix/phpx" self-update
          TOOLSET_SELF_UPDATE_RELEASE="$RELEASE_TAG" \
            "$prefix/cleanx" --update
          TOOLSET_SELF_UPDATE_RELEASE="$RELEASE_TAG" NO_COLOR=1 TERM=dumb \
            "$prefix/chromacat" --self-update

          for tool in gitx phpx cleanx chromacat; do
            expected="$(awk -v name="$tool" '$2 == name {print $1; exit}' dist/SHA256SUMS)"
            actual="$(sha256sum "$prefix/$tool" | awk '{print $1}')"
            [[ -n "$expected" && "$actual" == "$expected" ]] || {
              echo "RC self-update verification failed for $tool" >&2
              exit 1
            }
          done

      - name: Record RC verification summary
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          {
            echo '## Toolset 2.0 RC verification'
            echo
            echo "- Tag: \`$RELEASE_TAG\`"
            echo "- Source: \`$CANDIDATE_SHA\`"
            echo '- Exact candidate validation: passed'
            echo '- Published checksums/manifest: passed'
            echo '- Exact-release install of all seven tools: passed'
            echo '- Exact-release self-update paths: passed'
          } >> "$GITHUB_STEP_SUMMARY"
