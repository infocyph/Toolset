name: Apply sqlitex transactional bail

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-sqlitex-bail.py
      - .github/workflows/apply-sqlitex-bail.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0
      - name: Apply transaction bail fix
        run: python3 tests/patch-sqlitex-bail.py
      - name: Validate transactional behavior
        run: |
          bash -n Sqlite/sqlitex
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck sqlite3 jq
          shellcheck --severity=error Sqlite/sqlitex tests/sqlitex.sh
          bash tests/sqlitex.sh
      - name: Commit transaction bail fix
        run: |
          set -Eeuo pipefail
          git config user.name 'A. B. M. Mahmudul Hasan'
          git config user.email 'abmmhasan@users.noreply.github.com'
          git add Sqlite/sqlitex
          git diff --cached --quiet && exit 0
          git commit -m 'fix(sqlitex): rollback migration history on SQL failure'
          git push origin HEAD:plan/toolset-linux-cli-hardening
