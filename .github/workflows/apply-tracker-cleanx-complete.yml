name: Apply cleanx tracker completion

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-tracker-cleanx-complete.py
      - .github/workflows/apply-tracker-cleanx-complete.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Apply tracker update
        run: python3 tests/patch-tracker-cleanx-complete.py

      - name: Commit tracker update
        run: |
          set -Eeuo pipefail
          git config user.name 'A. B. M. Mahmudul Hasan'
          git config user.email 'abmmhasan@users.noreply.github.com'
          git add docs/plans/toolset-2.0-progress-tracker.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: complete cleanx phase 2 hardening'
          git push origin HEAD:plan/toolset-linux-cli-hardening
