name: Phase 1 contract fixes

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - '.github/workflows/phase1-contract-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening

      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # netx: brace port expansion before the regex character class.
          path = Path('Network/netx')
          text = path.read_text()
          old = 'grep -E ":$port[[:space:]]"'
          new = 'grep -E ":${port}[[:space:]]"'
          assert old in text, 'netx target not found'
          path.write_text(text.replace(old, new, 1))

          # phpx: replace the malformed literal carriage-return block with explicit escapes.
          path = Path('PHP/phpx')
          text = path.read_text()
          start = text.index('  _phpx_progress() {')
          end = text.index('  # Collect file list (null-safe)', start)
          replacement = '''  _phpx_progress() {
            (( show_progress )) || return 0
            local msg="$1"
            # \\r = carriage return, \\033[2K = clear whole line
            printf '\\r\\033[2K%-*.*s' "$cols" "$cols" "$msg" >&2
          }

          _phpx_clear_line() {
            (( show_progress )) || return 0
            printf '\\r\\033[2K' >&2
          }

'''
          path.write_text(text[:start] + replacement + text[end:])

          # dockex: help/version must not require Docker, jq, or awk.
          path = Path('Docker/dockex')
          text = path.read_text()
          assert 'set -euo pipefail\n' in text
          text = text.replace('set -euo pipefail\n', 'set -euo pipefail\n\nVERSION="2.0.0-dev"\n', 1)
          deps = '''require_cmd docker
          require_cmd jq
          require_cmd awk

'''
          assert deps in text, 'dockex dependency preflight not found'
          text = text.replace(deps, '', 1)
          marker = '}\n\n# ------------------ container helpers ------------------- #'
          assert marker in text, 'dockex usage boundary not found'
          insert = '''}

          case "${1:-}" in
          -h | --help | help)
            show_usage
            exit 0
            ;;
          -V | --version | version)
            printf 'dockex %s\\n' "$VERSION"
            exit 0
            ;;
          esac

          require_cmd docker
          require_cmd jq
          require_cmd awk

          # ------------------ container helpers ------------------- #'''
          path.write_text(text.replace(marker, insert, 1))

          # gitx: usage is informational; invalid-command failure belongs in dispatch.
          path = Path('Git/gitx')
          text = path.read_text()
          assert text.startswith('#!/bin/bash\n')
          text = text.replace('#!/bin/bash\n', '#!/bin/bash\n\nVERSION="2.0.0-dev"\n', 1)
          usage_tail = '  echo ""\n  exit 1\n}\n\nrequire_sudo() {'
          assert usage_tail in text, 'gitx usage exit target not found'
          text = text.replace(usage_tail, '  echo ""\n}\n\nrequire_sudo() {', 1)
          dispatch = '''case "$cmd" in
          ai-commit) generate_ai_commit ;;'''
          assert dispatch in text, 'gitx dispatch start not found'
          text = text.replace(dispatch, '''case "$cmd" in
          -h | --help | help) usage ;;
          -V | --version | version) printf 'gitx %s\\n' "$VERSION" ;;
          "") usage ;;
          ai-commit) generate_ai_commit ;;''', 1)
          invalid = 'summary) generate_git_summary "$@" ;;\n*) usage ;;\nesac'
          assert invalid in text, 'gitx invalid-command target not found'
          text = text.replace(invalid, '''summary) generate_git_summary "$@" ;;
          *)
            echo "Error: Unknown command '$cmd'." >&2
            usage >&2
            exit 2
            ;;
          esac''', 1)
          path.write_text(text)

          # sqlitex: expose help/version before DB and sqlite dependency validation.
          path = Path('Sqlite/sqlitex')
          text = path.read_text()
          assert text.startswith('#!/usr/bin/env bash\nset -euo pipefail\n')
          text = text.replace('#!/usr/bin/env bash\nset -euo pipefail\n', '#!/usr/bin/env bash\nset -euo pipefail\n\nVERSION="2.0.0-dev"\n', 1)
          usage_exit = '''  tune             [--profile dev|prod|safe]
          EOF
            exit 1
          }

          # Parse global options'''
          assert usage_exit in text, 'sqlitex usage exit target not found'
          preflight = '''  tune             [--profile dev|prod|safe]
          EOF
          }

          case "${1:-}" in
          -h | --help | help)
            usage
            exit 0
            ;;
          -V | --version | version)
            printf 'sqlitex %s\\n' "$VERSION"
            exit 0
            ;;
          esac

          # Parse global options'''
          text = text.replace(usage_exit, preflight, 1)
          path.write_text(text)
          PY

      - name: Validate changed scripts
        run: |
          bash -n Network/netx
          bash -n PHP/phpx
          bash -n Docker/dockex
          bash -n Git/gitx
          bash -n Sqlite/sqlitex

      - name: Commit fixes
        run: |
          git config user.name 'A. B. M. Mahmudul Hasan'
          git config user.email 'abmmhasan@users.noreply.github.com'
          git add Network/netx PHP/phpx Docker/dockex Git/gitx Sqlite/sqlitex
          git commit -m 'fix: normalize phase 1 CLI contracts and static errors'
          git push origin HEAD:plan/toolset-linux-cli-hardening
