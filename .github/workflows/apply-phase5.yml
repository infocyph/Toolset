name: Apply Phase 5 contracts

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-phase5.py
      - .github/workflows/apply-phase5.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-phase5-contracts
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Apply Phase 5 contracts
        run: python3 tests/patch-phase5.py

      - name: Validate modified tools and docs
        run: |
          set -Eeuo pipefail
          bash -n Git/gitx PHP/phpx Clean/cleanx ChromaCat/chromacat
          bash tests/chromacat.sh
          bash tests/docs.sh
          bash tests/security-audit.sh

      - name: Commit Phase 5 contracts
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- README.md Git/README.md PHP/README.md Docker/README.md Network/README.md Sqlite/README.md Clean/README.md ChromaCat/README.md Git/gitx PHP/phpx Clean/cleanx ChromaCat/chromacat; then
            echo 'No Phase 5 contract changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Git/README.md PHP/README.md Docker/README.md Network/README.md Sqlite/README.md Clean/README.md ChromaCat/README.md Git/gitx PHP/phpx Clean/cleanx ChromaCat/chromacat
          git commit -m 'docs: normalize Toolset 2.0 CLI contracts'
          git push origin HEAD:plan/toolset-linux-cli-hardening
