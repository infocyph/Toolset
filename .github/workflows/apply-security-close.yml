name: Apply final shell boundary cleanup

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-security-close.py
      - .github/workflows/apply-security-close.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-security-close
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0
      - name: Apply shell-boundary cleanup
        run: python3 tests/patch-security-close.py
      - name: Validate source and audit
        run: |
          set -Eeuo pipefail
          bash -n Docker/dockex
          bash tests/security-audit.sh
      - name: Commit cleanup
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- Docker/dockex; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Docker/dockex
          git commit -m 'fix: remove dockex interpolated shell probe'
          git push origin HEAD:plan/toolset-linux-cli-hardening
