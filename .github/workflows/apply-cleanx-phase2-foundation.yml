name: Apply cleanx Phase 2 foundation

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-cleanx-phase2-foundation.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Apply foundation hardening
        run: python3 tests/patch-cleanx-phase2-foundation.py

      - name: Validate cleanx
        run: |
          bash -n Clean/cleanx
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=error Clean/cleanx

      - name: Commit foundation hardening
        run: |
          set -Eeuo pipefail
          git config user.name 'A. B. M. Mahmudul Hasan'
          git config user.email 'abmmhasan@users.noreply.github.com'
          git add Clean/cleanx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(cleanx): harden config identity and locking'
          git push origin HEAD:plan/toolset-linux-cli-hardening
