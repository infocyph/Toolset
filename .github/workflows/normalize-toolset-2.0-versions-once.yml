name: Normalize Toolset 2.0 versions once

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - .github/workflows/normalize-toolset-2.0-versions-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Normalize suite versions
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/normalize-toolset-2.0-versions.py
          bash -n ChromaCat/chromacat Clean/cleanx Docker/dockex Git/gitx Network/netx PHP/phpx Sqlite/sqlitex

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq

      - name: Validate version contract
        run: |
          set -Eeuo pipefail
          shellcheck -S error ChromaCat/chromacat Clean/cleanx Docker/dockex Git/gitx Network/netx PHP/phpx Sqlite/sqlitex tests/contracts.sh tests/distribution.sh
          bash tests/contracts.sh
          bash tests/distribution.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('dist/manifest.json').read_text())
          assert m['suite']['version'] == '2.0'
          assert all(t['version'] == '2.0' for t in m['tools'])
          PY
          if git grep -nE '2\.0\.0-dev|VERSION="1\.3"|VERSION="1\.7\.0"|VERSION="0\.5\.0"' -- \
            'ChromaCat/chromacat' 'Clean/cleanx' 'Docker/dockex' 'Git/gitx' 'Network/netx' 'PHP/phpx' 'Sqlite/sqlitex' 'tests/generate-manifest.py' 'tests/distribution.sh'; then
            echo 'Stale pre-2.0 embedded version remains.' >&2
            exit 1
          fi

      - name: Commit permanent version normalization
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ChromaCat/chromacat Clean/cleanx Docker/dockex Git/gitx Network/netx PHP/phpx Sqlite/sqlitex tests/contracts.sh tests/generate-manifest.py tests/distribution.sh
          git diff --cached --quiet && exit 0
          git commit -m 'chore: normalize Toolset suite version to 2.0'
          git push origin HEAD:plan/toolset-linux-cli-hardening
