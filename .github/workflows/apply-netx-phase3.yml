name: Apply netx Phase 3

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-netx-phase3.py
      - tests/fix-netx-generated.py
      - tests/netx.sh
      - .github/workflows/apply-netx-phase3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Apply netx hardening
        run: |
          python3 tests/patch-netx-phase3.py
          python3 tests/fix-netx-generated.py

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq iproute2 netcat-openbsd openssl curl

      - name: Validate netx
        run: |
          bash -n Network/netx
          shellcheck --severity=error Network/netx tests/netx.sh
          bash tests/netx.sh

      - name: Commit netx hardening
        run: |
          set -Eeuo pipefail
          git config user.name 'A. B. M. Mahmudul Hasan'
          git config user.email 'abmmhasan@users.noreply.github.com'
          git add Network/netx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(netx): harden network automation boundaries'
          git push origin HEAD:plan/toolset-linux-cli-hardening
