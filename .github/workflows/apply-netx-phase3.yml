name: Apply netx Phase 3

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-netx-phase3.py
      - tests/netx.sh
      - .github/workflows/apply-netx-phase3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Apply netx hardening
        run: |
          python3 tests/patch-netx-phase3.py
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('Network/netx')
          t = p.read_text()

          old = '''        local proto local remote pid comm user local_ip local_port remote_ip remote_port
                  IFS='|' read -r proto local remote pid comm user <<<"$line"
                  IFS='|' read -r local_ip local_port < <(split_endpoint "$local")
                  IFS='|' read -r remote_ip remote_port < <(split_endpoint "$remote")
          '''
          new = '''        local proto local_ep remote_ep pid comm user local_ip local_port remote_ip remote_port
                  IFS='|' read -r proto local_ep remote_ep pid comm user <<<"$line"
                  IFS='|' read -r local_ip local_port < <(split_endpoint "$local_ep")
                  IFS='|' read -r remote_ip remote_port < <(split_endpoint "$remote_ep")
          '''
          if old not in t:
              raise SystemExit('generated guard variable block not found')
          t = t.replace(old, new, 1)

          pattern = r'''json_escape\(\) \{.*?\n\}\n\nvalidate_json_file\(\)'''
          replacement = r'''json_escape() {
            local data
            data="$(cat)"
            data=${data//\\/\\\\}
            data=${data//\"/\\\"}
            data=${data//$'\b'/\\b}
            data=${data//$'\f'/\\f}
            data=${data//$'\n'/\\n}
            data=${data//$'\r'/\\r}
            data=${data//$'\t'/\\t}
            printf '%s' "$data"
          }

          validate_json_file()'''
          t2, count = re.subn(pattern, replacement, t, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('generated JSON escape function not found')
          p.write_text(t2)
          PY

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq iproute2 netcat-openbsd openssl curl

      - name: Validate netx
        run: |
          bash -n Network/netx
          shellcheck --severity=error Network/netx tests/netx.sh
          bash tests/netx.sh

      - name: Commit netx hardening
        run: |
          set -Eeuo pipefail
          git config user.name 'A. B. M. Mahmudul Hasan'
          git config user.email 'abmmhasan@users.noreply.github.com'
          git add Network/netx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(netx): harden network automation boundaries'
          git push origin HEAD:plan/toolset-linux-cli-hardening
