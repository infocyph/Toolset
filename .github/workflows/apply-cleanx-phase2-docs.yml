name: Apply cleanx Phase 2 documentation

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-cleanx-phase2-docs.py
      - .github/workflows/apply-cleanx-phase2-docs.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Apply cleanx documentation contract
        run: python3 tests/patch-cleanx-phase2-docs.py

      - name: Validate cleanx contract
        run: |
          bash -n Clean/cleanx
          bash tests/cleanx.sh

      - name: Commit cleanx documentation contract
        run: |
          set -Eeuo pipefail
          git config user.name 'A. B. M. Mahmudul Hasan'
          git config user.email 'abmmhasan@users.noreply.github.com'
          git add Clean/cleanx Clean/README.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(cleanx): align phase 2 safety contract'
          git push origin HEAD:plan/toolset-linux-cli-hardening
