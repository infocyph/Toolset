name: Apply phpx Phase 2 foundation

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-phpx-phase2-foundation.py
      - .github/workflows/apply-phpx-phase2-foundation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Apply phpx foundation hardening
        run: python3 tests/patch-phpx-phase2-foundation.py

      - name: Validate phpx
        run: |
          bash -n PHP/phpx
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --severity=error PHP/phpx
          PHPX_LIBRARY_MODE=1 PHPX_NO_LOG=1 bash -c 'source PHP/phpx; [[ -n "$(detect_package_manager)" ]]; [[ -n "$(detect_service_manager)" ]]'

      - name: Commit phpx foundation hardening
        run: |
          set -Eeuo pipefail
          git config user.name 'A. B. M. Mahmudul Hasan'
          git config user.email 'abmmhasan@users.noreply.github.com'
          git add PHP/phpx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(phpx): separate capability and privilege boundaries'
          git push origin HEAD:plan/toolset-linux-cli-hardening
