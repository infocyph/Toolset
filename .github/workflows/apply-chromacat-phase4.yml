name: Apply chromacat Phase 4

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-chromacat-phase4.py
      - .github/workflows/apply-chromacat-phase4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-chromacat-phase4
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Apply chromacat hardening
        run: python3 tests/patch-chromacat-phase4.py

      - name: Validate chromacat
        run: |
          bash -n ChromaCat/chromacat
          bash tests/chromacat.sh

      - name: Commit chromacat hardening
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- ChromaCat/chromacat; then
            echo 'No chromacat changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ChromaCat/chromacat
          git commit -m 'feat: harden chromacat presentation pipeline'
          git push origin HEAD:plan/toolset-linux-cli-hardening
