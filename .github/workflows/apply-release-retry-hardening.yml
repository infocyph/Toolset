name: Apply release retry hardening once

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - .github/workflows/apply-release-retry-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0
      - name: Apply bounded retry hardening
        run: |
          set -Eeuo pipefail
          python3 .github/scripts/apply-release-retry-hardening.py
          bash -n install.sh Git/gitx PHP/phpx Clean/cleanx ChromaCat/chromacat
          bash tests/contracts.sh
          bash tests/security-audit.sh
      - name: Commit hardened release downloads
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: retry transient release downloads portably'
          git push origin HEAD:plan/toolset-linux-cli-hardening
