name: Apply Phase 3 tracker closeout

on:
  push:
    branches:
      - plan/toolset-linux-cli-hardening
    paths:
      - tests/patch-tracker-phase3-close.py
      - .github/workflows/apply-tracker-phase3-close.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: plan/toolset-linux-cli-hardening
          fetch-depth: 0

      - name: Apply tracker closeout
        run: python3 tests/patch-tracker-phase3-close.py

      - name: Commit tracker closeout
        run: |
          set -Eeuo pipefail
          git config user.name 'A. B. M. Mahmudul Hasan'
          git config user.email 'abmmhasan@users.noreply.github.com'
          git add docs/plans/toolset-2.0-progress-tracker.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: close Phase 3 hardening tracker'
          git push origin HEAD:plan/toolset-linux-cli-hardening
